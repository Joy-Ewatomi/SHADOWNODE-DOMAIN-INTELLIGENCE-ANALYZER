[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "domain-analyzer"
version = "0.1.0"
description = "Passive OSINT domain analysis and evidence-preserving intelligence pipeline"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "Joy"}
]
dependencies = [
    "requests",
    "dnspython",
]

[project.scripts]
domain-analyzer = "main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
